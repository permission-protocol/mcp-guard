default_action: allow
mode: enforce
rules:
  - id: post-x
    tool: post_x
    action: require_approval
    reversibility: irreversible
  - id: send-email
    tool: send_email
    action: require_approval
    reversibility: reversible
    countdown_seconds: 600
  - id: spend
    tool: spend
    action: require_approval
    reversibility: reversible
    cap_usd: 50
    amount_arg: amount_usd             # the argument the spend tool actually charges
    verify_threshold: 70
  - id: reauth
    tool: instantly_reauth
    action: require_approval
