# pp.config.yaml — Permission Deck Slice 1 policy for the Actions-MCP
#
# Consumed by `mcp-guard` (the stdio proxy), NOT by the Actions-MCP server itself.
# The Actions-MCP just executes; the guard does all classification and enforcement.
# Reversibility, countdown and spend cap live on each rule. The loader rejects any
# key it does not know, so a typo fails loudly instead of being ignored.

default_action: block        # deny by default — only the three known tools are reachable
mode: enforce                # "observe" to dry-run (log decisions, never block)

rules:
  # post_x is irreversible/public → human must approve before it executes.
  - id: hold-post-x
    tool: post_x
    action: require_approval
    reversibility: irreversible

  # send_email is reversible → held with a visible 5-minute countdown unless held.
  - id: hold-send-email
    tool: send_email
    action: require_approval
    reversibility: reversible
    countdown_seconds: 300

  # spend under $50 acts now and surfaces in Verify; $50 or more is a hard stop.
  # The cap reads amount_usd — the argument the spend tool charges.
  - id: hold-spend
    tool: spend
    action: require_approval
    reversibility: reversible
    cap_usd: 50
    amount_arg: amount_usd
