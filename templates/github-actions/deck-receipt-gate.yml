# Permission Deck Slice 2 — receipt-gate (reference, not run as-is).
#
# Fail-closed merge gate: a PR cannot merge unless a scoped, signed Permission Deck
# receipt exists and verifies OFFLINE against the published public key. No receipt =
# No deploy. This is intentional.
#
# How it works:
#   1. The Deck operator approves the `merge_pr` in the console -> mcp-guard issues a
#      signed receipt scoped `github:merge` to this PR's refs/pull/<n>/merge + head SHA.
#   2. This job runs `verify-receipt.mjs` with the PR's exact scope_ref/scope_sha.
#   3. verify-receipt.mjs verifies the Ed25519 signature against the published key,
#      checks status AUTHORIZED + expiry, and requires an EXACT scope match.
#   4. A wrong scope_sha (or no receipt) -> exit 1 -> required check stays red ->
#      branch protection blocks the merge.
#
# Wire-up:
#   - Make "Permission Deck Receipt Gate" a required status check in branch protection.
#   - Supply the receipt: either commit/publish .pp/merge-receipt.json, fetch it as
#     an artifact, or restore it before verification. The published public key
#     (.keys/pp-dev-1.pub.pem) is committable-safe, but the verifier must load it
#     from the protected base branch or another trusted source. The PRIVATE key
#     never belongs in the repository.

name: Permission Deck Receipt Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  receipt-gate:
    name: Permission Deck Receipt Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install + build mcp-guard
        run: |
          npm ci
          npm run build

      # The receipt file (.pp/merge-receipt.json) must be present in the
      # workspace. In a real deployment it is produced by the Deck and fetched
      # here (artifact, checkout of a receipts repo, or an API pull). The public
      # key is loaded from the protected base branch below.

      - name: Load trusted Permission Deck public key
        run: |
          mkdir -p "$RUNNER_TEMP/permission-deck"
          git fetch --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          git show "FETCH_HEAD:.keys/pp-dev-1.pub.pem" > "$RUNNER_TEMP/permission-deck/pp-dev-1.pub.pem"

      - name: Verify Permission Deck receipt (offline, fail-closed)
        run: |
          node scripts/verify-receipt.mjs \
            --receipt-file .pp/merge-receipt.json \
            --pubkey "$RUNNER_TEMP/permission-deck/pp-dev-1.pub.pem" \
            --scope "github:merge" \
            --scope-ref "refs/pull/${{ github.event.pull_request.number }}/merge" \
            --scope-sha "${{ github.event.pull_request.head.sha }}"
        # Exit 0 -> gate green -> merge allowed.
        # Exit non-zero -> ::error:: "No receipt = No deploy" -> required check red -> merge blocked.
