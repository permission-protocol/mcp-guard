# mcp-guard receipt gate — reference workflow for a deploy pipeline.
#
# A deploy runs only with a signed, unexpired receipt that a HUMAN approved for this
# exact scope and commit. "No receipt = No deploy. This is intentional."
#
# Trust boundaries (each one closes a bypass):
#   - Verifier code: a pinned npm version. Nothing from a pull request runs before the gate.
#   - Public key: read from the default branch, never from a pull request. Commit it once
#     with `npx @permission-protocol/mcp-guard export-key .pp/mcp-guard.pub.pem`.
#   - Receipt: delivered out of band (the workflow_dispatch input below), never read
#     from the repository tree, so committing a file cannot satisfy the gate.
#   - Scope: the receipt must name this environment and the exact commit being deployed.
#     Receipts released by a countdown or standing rule are refused (human approval only).
#
# Wire-up: trigger this workflow with the receipt JSON the approver received, e.g.
#   gh workflow run deploy.yml -f receipt="$(cat receipt.json)"

name: Deploy (receipt-gated)

on:
  workflow_dispatch:
    inputs:
      receipt:
        description: Signed mcp-guard receipt JSON for deploy:production at this commit
        required: true

permissions:
  contents: read

jobs:
  receipt-gate:
    name: mcp-guard receipt gate
    runs-on: ubuntu-latest
    steps:
      - name: Read the pinned public key from the default branch only
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .pp/mcp-guard.pub.pem
          sparse-checkout-cone-mode: false
          path: trust

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify the receipt (offline, fail closed)
        env:
          RECEIPT: ${{ inputs.receipt }}
        run: |
          printf '%s' "$RECEIPT" > "$RUNNER_TEMP/receipt.json"
          npx --yes @permission-protocol/mcp-guard@0.2.1 verify \
            --receipt-file "$RUNNER_TEMP/receipt.json" \
            --pubkey trust/.pp/mcp-guard.pub.pem \
            --scope deploy:production \
            --scope-sha "$GITHUB_SHA"

  deploy:
    needs: receipt-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deploy
        run: echo "Deploy $GITHUB_SHA here."
